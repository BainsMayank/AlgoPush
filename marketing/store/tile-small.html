<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AlgoPush — small promo tile</title>
<link rel="stylesheet" href="store.css">
<style>
    /* 440x280 is read at thumbnail size in the store grid, so this tile carries
       the mark, the name and one sentence — nothing that needs squinting. */
    .sheet {
        width: 440px;
        height: 280px;
        padding: 24px 26px 22px 46px;
        display: flex;
        flex-direction: column;
    }

    .rail { left: 26px; }

    .head { display: flex; align-items: center; gap: 11px; }
    .head .wordmark { font-size: 15px; letter-spacing: 0.22em; }
    .mark { display: block; width: 22px; height: 22px; }

    .head-rule { margin-top: 16px; }

    .body { flex: 1; display: flex; align-items: center; }
    .headline { font-size: 27px; font-variation-settings: 'wdth' 86, 'wght' 700; }
    .headline b {
        font-weight: 700;
        font-variation-settings: 'wdth' 86, 'wght' 700;
        color: var(--signal);
    }

    .foot { display: flex; align-items: center; justify-content: space-between; }
    .foot .caption { font-size: 9.5px; letter-spacing: 0.16em; }
    .chip { width: 29px; height: 20px; font-size: 10px; }
</style>
</head>
<body>
<div class="sheet">
    <span class="rail"></span>

    <header class="head">
        <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
            <path d="M64 18 94 60 74 60 74 92 54 92 54 60 34 60 Z" fill="#F4F1EA"/>
            <rect x="34" y="102" width="60" height="10" fill="#FF5436"/>
        </svg>
        <span class="wordmark">AlgoPush</span>
    </header>
    <div class="hr head-rule"></div>

    <div class="body">
        <h1 class="headline">Every Accepted submission,<br><b>committed to GitHub</b> for you.</h1>
    </div>

    <footer class="foot">
        <div class="chips">
            <span class="chip chip--lc">LC</span>
            <span class="chip chip--cf">CF</span>
            <span class="chip chip--ac">AC</span>
            <span class="chip chip--cc">CC</span>
        </div>
        <span class="caption">Four judges, one repo</span>
    </footer>
</div>
</body>
</html>
